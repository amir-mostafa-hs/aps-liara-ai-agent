[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/liara-agent-supervisord.pid

[program:engine]
command=python3 -m uvicorn engine.main:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:web]
command=pnpm --filter web start
directory=/app
environment=HOSTNAME="0.0.0.0",PORT="3000"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
